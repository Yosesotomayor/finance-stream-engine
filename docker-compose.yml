services:
  db:
    image: postgres:14.24
    container_name: db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  db-init:
    image: ghcr.io/astral-sh/uv:python3.12-bookworm
    container_name: db-init
    working_dir: /app
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "pip install python-dotenv sqlalchemy psycopg[binary] && PYTHONPATH=. python -m src.database.connection"
    restart: "no"

  redpanda:
      image: docker.redpanda.com/redpandadata/redpanda:latest
      container_name: broker
      command:
        - redpanda
        - start
        - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
        - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
        - --rpc-addr=0.0.0.0:33145
        - --advertise-rpc-addr=redpanda:33145
      ports:
        - "9092:9092"
        - "19092:19092"
        - "9644:9644"
      healthcheck:
        test: ["CMD-SHELL", "rpk cluster health >/dev/null 2>&1 || exit 1"]
        interval: 5s
        timeout: 10s
        retries: 10
        start_period: 20s
      volumes:
        - redpanda_data:/var/lib/redpanda/data

  redpanda-init:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: broker-init
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint:
      - /bin/bash
      - -lc
    command:
      - |
        set -e
        rpk topic create transactions.stream -X brokers=redpanda:9092 -p 1 -r 1 --if-not-exists
        rpk topic create transactions.dlq -X brokers=redpanda:9092 -p 1 -r 1 --if-not-exists
    restart: "no"

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:latest
    container_name: broker-console
    ports:
      - "8080:8080"
    environment:
      KAFKA_BROKERS: "redpanda:9092"
      REDPANDA_ADMIN_API_HOSTS: "redpanda:9644"
    entrypoint: /bin/sh
    command: -c "echo \"$$CONSOLE_CONFIG_FILE\" > /tmp/config.yml; /app/console"
    restart: on-failure
    depends_on:
      redpanda:
        condition: service_healthy

  api:
    image: ghcr.io/astral-sh/uv:python3.12-bookworm
    container_name: api
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    command: >
      sh -c "pip install python-dotenv fastapi uvicorn sqlalchemy psycopg[binary] confluent-kafka faker pydantic && PYTHONPATH=. uvicorn src.api.v1.app:app --host 0.0.0.0 --port 8000"
    depends_on:
      db-init:
        condition: service_completed_successfully
      redpanda-init:
        condition: service_started

  transaction-worker:
    image: ghcr.io/astral-sh/uv:python3.12-bookworm
    container_name: transaction-worker
    working_dir: /app
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - KAFKA_GROUP_ID=postgres_write_group
    command: >
      sh -c "pip install python-dotenv sqlalchemy psycopg[binary] confluent-kafka && PYTHONPATH=. python src/workers/transaction_worker.py"
    restart: always
    depends_on:
      db-init:
        condition: service_completed_successfully
      redpanda-init:
        condition: service_completed_successfully

volumes:
  postgres_data:
  redpanda_data: