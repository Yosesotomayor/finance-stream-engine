services:
  db:
    image: postgres:14.24
    container_name: db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  db-init:
    image: ghcr.io/astral-sh/uv:python3.12-bookworm
    container_name: db-init
    working_dir: /app
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "pip install python-dotenv sqlalchemy psycopg[binary] && PYTHONPATH=. python -m src.database.connection"
    restart: "no"
    
  redpanda:
      image: docker.redpanda.com/redpandadata/redpanda:latest
      container_name: queue
      command:
        - redpanda
        - start
      ports:
        - "9092:9092"   # Puerto principal para la API de Kafka
        - "9644:9644"   # Puerto de administración/health check
      volumes:
        - redpanda_data:/var/lib/redpanda/data

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:latest
    container_name: queue_console
    ports:
      - "8080:8080" # Puerto para la interfaz web de Redpanda Console
    environment:
      KAFKA_BROKERS: "redpanda:9092"
    depends_on:
      - redpanda

volumes:
  postgres_data:
  redpanda_data: